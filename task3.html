<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 3 - Table Reservation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-3 p-md-5">

  <div class="card shadow-sm border-0 mx-auto" style="max-width: 600px; border-radius: 12px;">
    <div class="card-body p-4">
      <h2 class="h4 mb-4 fw-bold">Reserve a table</h2>
      
      <form action="#" method="POST">

        <div class="mb-3">
          <label for="fullName" class="form-label fw-semibold">Full Name</label>
          <input type="text" class="form-control" id="fullName" name="fullName" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Email</label>
          <input type="email" class="form-control" id="email" name="email" required>
        </div>

        <div class="mb-3">
          <label for="phone" class="form-label fw-semibold">Phone</label>
          <input type="tel" class="form-control" id="phone" name="phone" required>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="guests" class="form-label fw-semibold">Guests</label>
            <input type="number" class="form-control" id="guests" name="guests" min="1" max="20" required>
          </div>
          <div class="col-md-6">
            <label for="resDate" class="form-label fw-semibold">Date</label>
            <input type="date" class="form-control" id="resDate" name="resDate" required>
          </div>
        </div>

        <div class="mb-3">
          <label for="mealTime" class="form-label fw-semibold">Meal Time</label>
          <select class="form-select" id="mealTime" name="mealTime" required>
            <option value="">Select time...</option>
            <option value="lunch">Lunch</option>
            <option value="dinner">Dinner</option>
          </select>
        </div>

        <fieldset class="mb-3">
          <legend class="col-form-label fw-semibold pt-0">Seating</legend>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="seating" id="seatingInside" value="inside" required>
            <label class="form-check-label" for="seatingInside">Inside</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="seating" id="seatingTerrace" value="terrace">
            <label class="form-check-label" for="seatingTerrace">Terrace</label>
          </div>
        </fieldset>

        <div class="mb-3">
          <label for="comments" class="form-label fw-semibold">Comments</label>
          <textarea class="form-control" id="comments" name="comments" rows="3"></textarea>
        </div>

        <div class="mb-4 form-check">
          <input class="form-check-input" type="checkbox" id="agreeTerms" name="agreeTerms" required>
          <label class="form-check-label fw-medium" for="agreeTerms">I agree to the terms</label>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Reserve</button>
      </form>
    </div>
  </div>

</body>
</html>
