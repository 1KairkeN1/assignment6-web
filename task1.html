<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="body">
      <div class="outer">
        <div class="card-container">
            <div class="container-header">
                <h2>Book a train ticket</h2>
            </div>

            <div class="container-body">
                
                <div class="pill mb-4">
                    <label class="pill-content">
                        <input type="radio" name="tripType" value="oneway" checked>
                        <span>One Way</span>
                    </label>
                    <label class="pill-content">
                        <input type="radio" name="tripType" value="roundtrip">
                        <span>Round Trip</span>
                    </label>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-12 col-md-6 form-group">
                        <label for="from-city" class="form-label">From</label>
                        <input type="text" id="from-city" name="fromCity" class="form-control">
                    </div>

                    <div class="col-12 col-md-6 form-group">
                        <label for="to-city" class="form-label">To</label>
                        <input type="text" id="to-city" name="toCity" class="form-control">
                    </div>
                </div>

                <div class="row g-3 mb-3">
                  <div class="col-12 col-md-4 form-group">
                    <label for="dept-date" class="form-label">Departure date</label>
                    <input 
                      type="date" 
                      id="dept-date" 
                      name="deptDate" 
                      class="form-control"
                      required
                    >
                  </div>

                  <div class="col-12 col-md-4 form-group">
                    <label for="return-date" class="form-label">Return date</label>
                    <input 
                      type="date" 
                      id="return-date" 
                      name="returnDate"
                      class="form-control"
                    >
                  </div>

                  <div class="col-12 col-md-4 form-group">
                    <label for="passengers" class="form-label">Passengers</label>
                    <input 
                      type="number" 
                      id="passengers" 
                      name="passengers" 
                      class="form-control"
                      min="1" 
                      max="10" 
                      value="1" 
                      required
                    >
                  </div>
                </div>

                <div class="row g-3 mb-4">
                  <div class="col-12 col-md-6 form-group">
                    <label for="phone" class="form-label">Phone</label>
                    <div class="input-group phone-input-wrapper">
                      <span class="input-group-text country-code">+7</span>
                      <input 
                        type="tel" 
                        id="phone" 
                        name="phone" 
                        class="form-control"
                        placeholder="701 234 56 78" 
                        required
                      >
                    </div>
                  </div>

                  <div class="col-12 col-md-6 form-group">
                    <label for="email" class="form-label">Email</label>
                    <input 
                      type="email" 
                      id="email" 
                      name="email" 
                      class="form-control"
                      placeholder="name@example.com" 
                      required
                    >
                  </div>
                </div>

                <div class="options-group mb-4">
                  <label class="toggle-switch">
                    <input type="checkbox" name="sendSms">
                    <span class="slider"></span>
                    <span class="option-label">Also send the ticket by SMS</span>
                  </label>

                  <label class="checkbox-option">
                    <input type="checkbox" name="agreeRules" required>
                    <span class="option-label">I agree with the carriage rules</span>
                  </label>
                </div>

                <div class="d-flex justify-content-end gap-3 button-row">
                  <button type="reset" class="btn btn-clear">Clear</button>
                  <button type="submit" class="btn btn-submit">Find trains</button>
                </div>

            </div>
        </div>
      </div>
  </body>
</html>
